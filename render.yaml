services:
  - type: web
    name: automated-learning-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    region: oregon
    rootDir: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: automated-learning-db
          property: connectionString

databases:
  - name: automated-learning-db
    databaseName: learning_system
    user: learning_system
    plan: free
